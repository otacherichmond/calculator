<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator.css">
    <script src="calculator.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <h3>SHADOW</h3>
        <input type="text" id="display" readonly>
        <div class="keys">
            <button id="key" onclick="clearInput()">C</button>
            <button id="key" onclick="removeValues()" class="span">DEL</button>
            <button id="key" onclick="displayOnInput('/')" class="operator">/</button>
            <button id="key" onclick="displayOnInput('7')">7</button>
            <button id="key" onclick="displayOnInput('8')">8</button>
            <button id="key" onclick="displayOnInput('9')">9</button>
            <button id="key" onclick="displayOnInput('*')" class="operator">X</button>
            <button id="key" onclick="displayOnInput('4')">4</button>
            <button id="key" onclick="displayOnInput('5')">5</button>
            <button id="key" onclick="displayOnInput('6')">6</button>
            <button id="key" onclick="displayOnInput('-')" class="operator">-</button>
            <button id="key" onclick="displayOnInput('1')">1</button>
            <button id="key" onclick="displayOnInput('2')">2</button>
            <button id="key" onclick="displayOnInput('3')">3</button>
            <button id="key" onclick="displayOnInput('+')" class="operator">+</button>
            <button id="key" onclick="displayOnInput('00')">00</button>
            <button id="key" onclick="displayOnInput('0')">0</button>
            <button id="key" onclick="displayOnInput('.')">.</button>
            <button id="key" onclick="calculate()" class="equal">=</button>
        </div>
    </div>
</body>
</html>
